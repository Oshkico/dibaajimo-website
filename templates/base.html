<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Dibaajimo</title>
  {# Main CSS styling goes here, which is output by Tailwind #}
  <link rel="stylesheet" type="text/css" href="/style.css">
   <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/images/dibaajimo.png">
</head>

<body class="bg-gray-800">
   <nav class="w-full bg-gray-800 pt-3 pb-3">
  <div class="mx-auto flex h-16 max-w-7xl items-center px-6">

    <!-- Logo -->
    <div class="flex-1 h-full">
      <a href="/" class="text-xl text-white font-bold">
        <img src="/images/dibaajimo.png" class="h-full p-1" />
      </a>
    </div>

    <!-- Center Links -->
    <div class="flex items-center gap-8">
      <a href="/about" class="text-sm text-white hover:text-white hover:font-bold {% if current_path == '/about/' %}font-bold{% endif %}">
        About
      </a>

      <a href="/projects" class="text-sm text-white hover:text-white hover:font-bold {% if current_path == '/projects/' %}font-bold{% endif %}">
        Projects
      </a>

      <a href="/contact" class="text-sm text-white hover:text-white hover:font-bold {% if current_path == '/contact/' %}font-bold{% endif %}">
        Contact
      </a>
    </div>

    <!-- Right Icon Links -->
    <div class="flex flex-1 justify-end items-center gap-4">

      <!-- Instagram -->
   <a
        href="https://instagram.com/dibaajimo"
        aria-label="Instagram"
        class="text-white hover:text-red-500"
      >
        <img src="/images/instagram.svg" role="img" alt="A vector star" class="h-5 w-5" style="filter: brightness(0) saturate(100%) invert(100%);"/>
      </a>

      <!-- Facebook -->
      <a
        href="https://facebook.com/dibaajimo"
        aria-label="Facebook"
        class="text-white hover:text-red-500"
      >
        <img src="/images/facebook.svg" role="img" alt="A vector star" class="h-5 w-5" style="filter: brightness(0) saturate(100%) invert(100%);"/>
      </a>

       <!-- LinkedIn -->
      <a
        href="https://linkedin.com/dibaajimo"
        aria-label="LinkedIn"
        class="text-white hover:text-red-500"
      >
        <img src="/images/linkedin.svg" role="img" alt="A vector star" class="h-5 w-5" style="filter: brightness(0) saturate(100%) invert(100%);"/>
      </a>

       <!-- Bluesky -->
      <a
        href="https://bluesky.com/dibaajimo"
        aria-label="Bluesky"
        class="text-white hover:text-red-500"
      >
        <img src="/images/bluesky.svg" role="img" alt="A vector star" class="h-5 w-5" style="filter: brightness(0) saturate(100%) invert(100%);"/>
      </a>

 

    </div>

  </div>
</nav>
  <section>
    <div>
      {% block content %} {% endblock content %}
    </div>
  </section>

  <footer class="bg-gray-800">
  <div class="mx-auto max-w-7xl px-6 py-12">

    <!-- Main Footer -->
    <div class="mx-auto flex flex-col items-center justify-between gap-8 md:flex-row">

      <!-- Logo / Brand -->
      <div class="flex-1 ">
      <a href="/" class="text-xl text-white font-bold h-[100px] inline-block">
        <img src="/images/dibaajimo.png" class="h-full p-1" />
      </a>
    </div>

      <!-- Page Links -->
      <nav class="flex items-center gap-8">

        <a
          href="/about"
          class="text-sm text-gray-300 transition hover:text-white"
        >
          About
        </a>

        <a
          href="/projects"
          class="text-sm text-gray-300 transition hover:text-white"
        >
          Projects
        </a>

        <a
          href="/contact"
          class="text-sm text-gray-300 transition hover:text-white"
        >
          Contact
        </a>
      </nav>

   <!-- Right Icon Links -->
    <div class="flex flex-1 justify-end items-center gap-4">

      <!-- Instagram -->
   <a
        href="https://instagram.com/dibaajimo"
        aria-label="Instagram"
        class="text-white hover:text-red-500"
      >
        <img src="/images/instagram.svg" role="img" alt="A vector star" class="h-5 w-5" style="filter: brightness(0) saturate(100%) invert(100%);"/>
      </a>

      <!-- Facebook -->
      <a
        href="https://facebook.com/dibaajimo"
        aria-label="Facebook"
        class="text-white hover:text-red-500"
      >
        <img src="/images/facebook.svg" role="img" alt="A vector star" class="h-5 w-5" style="filter: brightness(0) saturate(100%) invert(100%);"/>
      </a>

       <!-- LinkedIn -->
      <a
        href="https://linkedin.com/dibaajimo"
        aria-label="LinkedIn"
        class="text-white hover:text-red-500"
      >
        <img src="/images/linkedin.svg" role="img" alt="A vector star" class="h-5 w-5" style="filter: brightness(0) saturate(100%) invert(100%);"/>
      </a>

       <!-- Bluesky -->
      <a
        href="https://bluesky.com/dibaajimo"
        aria-label="Bluesky"
        class="text-white hover:text-red-500"
      >
        <img src="/images/bluesky.svg" role="img" alt="A vector star" class="h-5 w-5" style="filter: brightness(0) saturate(100%) invert(100%);"/>
      </a>

    </div>

    </div>

    <!-- Copyright -->
    <div class="mt-10 border-t pt-6 text-center text-sm text-gray-500">
      © 2026 Dibaajimo. All rights reserved.
    </div>

  </div>
</footer>
</body>

</html>
